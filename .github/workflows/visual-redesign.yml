name: Apply professional UI redesign

on:
  push:
    paths:
      - .github/workflows/visual-redesign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: python .github/redesign_pack_ui.py
      - name: Validate syntax
        run: python -m py_compile "pack data/2.5.PY"
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/visual-redesign.yml .github/redesign_pack_ui.py
          git add "pack data/2.5.PY"
          git diff --cached --check
          git commit -m "Redesign pack content UI and add local asset fallback"
          git push
